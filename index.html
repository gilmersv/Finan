<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FINAN · Aprende a manejar tu dinero jugando</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#10B981; --verde-dark:#059669; --verde-soft:#D1FAE5;
  --sol:#F59E0B; --sol-dark:#D97706; --sol-soft:#FEF3C7;
  --tinta:#1E293B; --gris:#64748B; --gris-soft:#94A3B8;
  --nube:#F1F5F9; --nube-2:#F8FAFC; --blanco:#FFFFFF;
  --coral:#EF4444; --coral-soft:#FEE2E2;
  --violeta:#8B5CF6; --violeta-soft:#EDE9FE;
  --azul:#3B82F6; --azul-soft:#DBEAFE;
  --linea:#E2E8F0;
  --sombra:0 4px 14px rgba(15,23,42,.08);
  --sombra-fuerte:0 10px 30px rgba(15,23,42,.16);
  --r:20px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  background:
    radial-gradient(1200px 600px at 10% -10%, #E9FBF3 0%, transparent 55%),
    radial-gradient(1000px 700px at 110% 10%, #FFF6E6 0%, transparent 50%),
    #EAF0F6;
  color:var(--tinta);
  display:flex;align-items:center;justify-content:center;
  min-height:100dvh;padding:20px;
  overscroll-behavior:none;
}
/* ---------- Marco de teléfono (solo escritorio) ---------- */
.phone{
  width:400px;height:840px;max-height:calc(100dvh - 40px);
  background:var(--blanco);
  border-radius:44px;
  box-shadow:var(--sombra-fuerte), 0 0 0 12px #0f172a, 0 0 0 14px #1e293b;
  position:relative;overflow:hidden;display:flex;flex-direction:column;
}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:150px;height:26px;background:#0f172a;border-radius:0 0 18px 18px;z-index:60}
@media (max-width:440px){
  body{padding:0}
  .phone{width:100vw;height:100dvh;max-height:100dvh;border-radius:0;box-shadow:none}
  .notch{display:none}
}
/* ---------- Barra superior (gamificación) ---------- */
.topbar{
  flex:0 0 auto;display:flex;align-items:center;gap:8px;
  padding:34px 16px 12px;background:var(--blanco);
  border-bottom:1px solid var(--linea);z-index:20;
}
.topbar.hidden{display:none}
.stat{display:flex;align-items:center;gap:5px;font-weight:800;font-size:15px}
.stat .ico{font-size:18px;line-height:1}
.stat.vidas{color:var(--coral)} .stat.sol{color:var(--sol-dark)}
.stat.xp{color:var(--violeta)} .stat.racha{color:var(--sol-dark)}
.topbar .spacer{flex:1}
.pill{background:var(--nube);border-radius:999px;padding:5px 11px}
/* ---------- Zona de contenido ---------- */
.screens{flex:1 1 auto;position:relative;overflow:hidden}
.screen{
  position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
  padding:20px 18px 24px;display:none;
  -webkit-overflow-scrolling:touch;
}
.screen.active{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.8);opacity:0}60%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
/* ---------- Navegación inferior ---------- */
.navbar{
  flex:0 0 auto;display:flex;background:var(--blanco);
  border-top:1px solid var(--linea);padding:8px 6px calc(8px + env(safe-area-inset-bottom));
}
.navbar.hidden{display:none}
.navbtn{flex:1;background:none;border:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:6px 0;border-radius:14px;color:var(--gris-soft);font-family:inherit;
  font-weight:800;font-size:10.5px;transition:.2s}
.navbtn .ico{font-size:22px;line-height:1}
.navbtn.on{color:var(--verde-dark)}
.navbtn.on .ico{transform:translateY(-1px)}
/* ---------- Tipografía utilitaria ---------- */
h1{font-size:26px;font-weight:900;letter-spacing:-.5px;line-height:1.15}
h2{font-size:21px;font-weight:900;letter-spacing:-.3px;line-height:1.2}
h3{font-size:16px;font-weight:800}
.muted{color:var(--gris)} .small{font-size:13px}
.center{text-align:center}
.soles{font-variant-numeric:tabular-nums}
/* ---------- Botones ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  width:100%;border:none;cursor:pointer;font-family:inherit;
  font-weight:900;font-size:16px;color:var(--blanco);
  background:var(--verde);border-radius:16px;padding:15px 18px;
  box-shadow:0 4px 0 var(--verde-dark);transition:transform .06s,box-shadow .06s;
  letter-spacing:.2px;
}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--verde-dark)}
.btn.sol{background:var(--sol);box-shadow:0 4px 0 var(--sol-dark)}
.btn.sol:active{box-shadow:0 1px 0 var(--sol-dark)}
.btn.ghost{background:var(--blanco);color:var(--tinta);
  box-shadow:0 0 0 2px var(--linea) inset;border-radius:16px}
.btn.ghost:active{transform:translateY(2px)}
.btn.dark{background:var(--tinta);box-shadow:0 4px 0 #0f172a}
.btn:disabled{opacity:.45;box-shadow:none;cursor:default;transform:none}
.btn.sm{width:auto;padding:11px 18px;font-size:14px;border-radius:13px}
/* ---------- Tarjetas ---------- */
.card{background:var(--blanco);border:1px solid var(--linea);
  border-radius:var(--r);padding:18px;box-shadow:var(--sombra)}
.card+.card{margin-top:14px}
.tag{display:inline-block;font-size:11px;font-weight:900;padding:4px 10px;
  border-radius:999px;letter-spacing:.4px;text-transform:uppercase}
.tag.verde{background:var(--verde-soft);color:var(--verde-dark)}
.tag.sol{background:var(--sol-soft);color:var(--sol-dark)}
.tag.violeta{background:var(--violeta-soft);color:#6D28D9}
/* ---------- Opciones (quiz / decisiones) ---------- */
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--blanco);border:2px solid var(--linea);border-radius:16px;
  padding:15px 16px;cursor:pointer;font-family:inherit;font-weight:700;
  font-size:14.5px;color:var(--tinta);transition:.12s;margin-bottom:11px;line-height:1.35}
.opt:active{transform:scale(.99)}
.opt .lead{flex:0 0 auto;width:30px;height:30px;border-radius:9px;
  background:var(--nube);display:grid;place-items:center;font-weight:900;font-size:15px}
.opt.correct{border-color:var(--verde);background:var(--verde-soft)}
.opt.correct .lead{background:var(--verde);color:#fff}
.opt.wrong{border-color:var(--coral);background:var(--coral-soft)}
.opt.wrong .lead{background:var(--coral);color:#fff}
.opt.dim{opacity:.5}
.opt:disabled{cursor:default}
/* ---------- Barra de progreso ---------- */
.prog{height:14px;background:var(--nube);border-radius:999px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--verde);border-radius:999px;
  transition:width .5s cubic-bezier(.2,.8,.2,1)}
.prog.sol>i{background:var(--sol)}
.prog.violeta>i{background:var(--violeta)}
/* ---------- Feedback inferior (correcto/incorrecto) ---------- */
.feedback{position:absolute;left:0;right:0;bottom:0;padding:18px;
  border-radius:24px 24px 0 0;animation:slideUp .3s ease;z-index:40}
.feedback.ok{background:var(--verde-soft);border-top:2px solid var(--verde)}
.feedback.no{background:var(--coral-soft);border-top:2px solid var(--coral)}
.feedback h3{font-size:17px}
.feedback .ok-t{color:var(--verde-dark)} .feedback .no-t{color:var(--coral)}
/* ---------- Chips de dinero (arrastrar visual) ---------- */
.money-row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{background:var(--sol-soft);color:var(--sol-dark);font-weight:900;
  padding:9px 13px;border-radius:12px;font-size:14px;border:2px solid transparent;
  cursor:pointer;transition:.12s}
.chip.sel{border-color:var(--sol);background:var(--sol);color:#fff}
.chip.gone{opacity:.3;text-decoration:line-through}
/* ---------- Nodos del mapa ---------- */
.map-path{position:relative;padding:6px 0 20px}
.node{position:relative;display:flex;align-items:center;gap:14px;margin:0 auto;
  width:max-content;padding:6px 0}
.node .dot{width:66px;height:66px;border-radius:22px;display:grid;place-items:center;
  font-size:30px;box-shadow:var(--sombra);position:relative;flex:0 0 auto;cursor:pointer;
  transition:transform .12s}
.node .dot:active{transform:scale(.94)}
.node.done .dot{background:var(--verde);color:#fff;box-shadow:0 6px 0 var(--verde-dark)}
.node.current .dot{background:var(--sol);color:#fff;box-shadow:0 6px 0 var(--sol-dark);
  animation:bob 2s ease-in-out infinite}
.node.locked .dot{background:var(--nube);color:var(--gris-soft);cursor:not-allowed}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.node .lbl{font-weight:800;font-size:13.5px;max-width:150px;line-height:1.25}
.node.locked .lbl{color:var(--gris-soft)}
.node .lvl-num{font-size:11px;font-weight:900;color:var(--gris-soft);text-transform:uppercase;letter-spacing:.5px}
.connector{width:5px;height:26px;background:var(--linea);margin:0 auto;border-radius:3px}
.connector.done{background:var(--verde)}
.node.zig{margin-left:34px} .node.zag{margin-right:34px;flex-direction:row-reverse;text-align:right}
/* ---------- Insignias ---------- */
.badge-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.badge{text-align:center;padding:14px 6px;border-radius:16px;background:var(--nube-2);
  border:1px solid var(--linea)}
.badge .b-ico{font-size:32px;filter:grayscale(1);opacity:.35}
.badge.got{background:var(--sol-soft);border-color:var(--sol)}
.badge.got .b-ico{filter:none;opacity:1}
.badge .b-name{font-size:10.5px;font-weight:800;margin-top:5px;line-height:1.2}
/* ---------- Salud financiera ---------- */
.dim-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.dim-row .d-name{flex:0 0 118px;font-size:12.5px;font-weight:800}
.dim-row .prog{flex:1}
.dim-row .d-val{flex:0 0 34px;text-align:right;font-weight:900;font-size:12.5px}
.gauge{width:150px;height:150px;margin:0 auto;position:relative}
.gauge svg{transform:rotate(-90deg)}
.gauge .g-num{position:absolute;inset:0;display:grid;place-items:center;flex-direction:column}
.gauge .g-num b{font-size:40px;font-weight:900;line-height:1}
/* ---------- Chat FINAN ---------- */
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
.msg{max-width:82%;padding:12px 14px;border-radius:18px;font-size:14px;
  font-weight:600;line-height:1.4;animation:pop .25s ease}
.msg.bot{background:var(--nube);border-bottom-left-radius:5px;align-self:flex-start}
.msg.me{background:var(--verde);color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
.suggest{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.suggest button{background:var(--verde-soft);color:var(--verde-dark);border:none;
  font-family:inherit;font-weight:800;font-size:12.5px;padding:9px 13px;border-radius:999px;cursor:pointer}
/* ---------- Simuladores ---------- */
.slider-row{margin:16px 0}
.slider-row label{display:flex;justify-content:space-between;font-weight:800;font-size:13.5px;margin-bottom:8px}
.slider-row label b{color:var(--verde-dark);font-size:15px}
input[type=range]{-webkit-appearance:none;width:100%;height:8px;border-radius:999px;
  background:var(--nube);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;
  border-radius:50%;background:var(--verde);cursor:pointer;box-shadow:var(--sombra);border:3px solid #fff}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:var(--verde);
  cursor:pointer;border:3px solid #fff}
.result-box{background:var(--tinta);color:#fff;border-radius:16px;padding:16px;margin-top:8px}
.result-box .rb-row{display:flex;justify-content:space-between;padding:5px 0;font-weight:700;font-size:14px}
.result-box .rb-row b{font-variant-numeric:tabular-nums}
.result-box .big{font-size:22px;font-weight:900}
.donut{width:158px;height:158px;margin:6px auto 4px}
.donut canvas{width:100%;height:100%;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin-top:10px}
.legend span{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.credit-card{border:2px solid var(--linea);border-radius:16px;padding:14px;cursor:pointer;transition:.15s}
.credit-card.pick{border-color:var(--verde);background:var(--verde-soft)}
.credit-card h3{font-size:14px;margin-bottom:8px}
.credit-card .cc-row{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;padding:3px 0}
/* ---------- Toast ---------- */
.toast{position:absolute;left:50%;top:70px;transform:translateX(-50%) translateY(-20px);
  background:var(--tinta);color:#fff;font-weight:800;font-size:13.5px;padding:11px 18px;
  border-radius:999px;box-shadow:var(--sombra-fuerte);opacity:0;pointer-events:none;
  transition:.3s;z-index:80;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---------- Reward overlay ---------- */
.overlay{position:absolute;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);
  display:none;place-items:center;z-index:70;padding:24px}
.overlay.show{display:grid;animation:fade .3s}
.reward{background:#fff;border-radius:28px;padding:30px 24px;text-align:center;width:100%;
  animation:pop .4s ease}
.reward .r-emoji{font-size:64px;animation:bob 1.6s ease-in-out infinite}
.reward .r-rewards{display:flex;justify-content:center;gap:14px;margin:18px 0}
.reward .r-chip{background:var(--nube);border-radius:14px;padding:10px 16px;font-weight:900}
.reward .r-chip .v{font-size:20px}
/* ---------- Misc ---------- */
.spacer-s{height:12px}.spacer-m{height:20px}.spacer-l{height:32px}
.scene{background:linear-gradient(135deg,var(--verde-soft),var(--sol-soft));
  border-radius:20px;padding:22px;text-align:center;margin-bottom:16px}
.scene .avatar{font-size:56px;margin-bottom:6px}
.scene .bubble{background:#fff;border-radius:16px;padding:14px;font-weight:700;
  font-size:15px;box-shadow:var(--sombra);position:relative;line-height:1.4}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi .k{background:var(--nube-2);border:1px solid var(--linea);border-radius:14px;padding:12px;text-align:center}
.kpi .k b{font-size:22px;font-weight:900;display:block;color:var(--verde-dark)}
.kpi .k span{font-size:11px;font-weight:700;color:var(--gris)}
.lesson-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.lesson-head .x{font-size:24px;color:var(--gris-soft);background:none;border:none;cursor:pointer;font-weight:900}
.lesson-head .prog{flex:1}
ul.clean{list-style:none} ul.clean li{padding:7px 0 7px 26px;position:relative;font-weight:600;font-size:14px;line-height:1.4}
ul.clean li:before{content:"✓";position:absolute;left:0;color:var(--verde);font-weight:900}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="phone">
  <div class="notch"></div>

  <!-- Barra superior -->
  <div class="topbar hidden" id="topbar">
    <div class="stat racha pill"><span class="ico">🔥</span><span id="t-racha">0</span></div>
    <div class="stat sol pill"><span class="ico">🪙</span><span id="t-sol">0</span></div>
    <div class="stat xp pill"><span class="ico">⭐</span><span id="t-xp">0</span></div>
    <div class="spacer"></div>
    <div class="stat vidas pill"><span class="ico">❤️</span><span id="t-vidas">5</span></div>
  </div>

  <!-- Pantallas -->
  <div class="screens" id="screens">
    <!-- se rellenan por JS -->
  </div>

  <!-- Navegación inferior -->
  <div class="navbar hidden" id="navbar">
    <button class="navbtn on" data-nav="map"><span class="ico">🗺️</span>Aprender</button>
    <button class="navbtn" data-nav="sims"><span class="ico">🧮</span>Simuladores</button>
    <button class="navbtn" data-nav="finan"><span class="ico">🤖</span>FINAN</button>
    <button class="navbtn" data-nav="profile"><span class="ico">👤</span>Perfil</button>
  </div>

  <div class="toast" id="toast"></div>

  <div class="overlay" id="overlay">
    <div class="reward" id="reward"></div>
  </div>
</div>

<script>
/* ================= ESTADO GLOBAL (en memoria) ================= */
const S = {
  name:"", nivelPerfil:"Explorador",
  lang:null,   // 'es' | 'en' | 'qu' | 'ay' — elegido al inicio
  xp:0, sol:0, racha:1, vidas:5,
  levels:{}, // id -> 'done'|'current'|'locked'
  badges:new Set(),
  salud:{presupuesto:0,ahorro:0,fondo:0,deuda:0,seguridad:0,conocimiento:0,metas:0},
  screen:"welcome",
  onboarded:false,   // true tras completar el diagnóstico
  lastDay:null       // fecha ISO del último día activo (para la racha)
};

/* ================= PERSISTENCIA (offline-first) =================
   Usa localStorage cuando está disponible (app descargada / instalada).
   Si el entorno lo bloquea, cae de forma transparente a memoria. */
const STORE_KEY = "finan_v1";
let _mem = null;             // respaldo en memoria si no hay localStorage
function _storageOK(){
  try{ const k="__t"; localStorage.setItem(k,"1"); localStorage.removeItem(k); return true; }
  catch(e){ return false; }
}
const HAS_LS = _storageOK();
function saveState(){
  const data = {
    name:S.name, nivelPerfil:S.nivelPerfil, lang:S.lang, xp:S.xp, sol:S.sol, racha:S.racha,
    vidas:S.vidas, levels:S.levels, badges:[...S.badges], salud:S.salud,
    onboarded:S.onboarded, lastDay:S.lastDay
  };
  const json = JSON.stringify(data);
  if(HAS_LS){ try{ localStorage.setItem(STORE_KEY,json); }catch(e){ _mem=json; } }
  else _mem = json;
}
function loadState(){
  let json = HAS_LS ? (()=>{try{return localStorage.getItem(STORE_KEY);}catch(e){return null;}})() : _mem;
  if(!json) return false;
  try{
    const d = JSON.parse(json);
    Object.assign(S, d);
    S.badges = new Set(d.badges||[]);
    return !!S.onboarded;
  }catch(e){ return false; }
}
function clearState(){
  if(HAS_LS){ try{ localStorage.removeItem(STORE_KEY); }catch(e){} }
  _mem = null;
}

/* Definición de los 14 niveles */
const LEVELS = [
  {id:1, emoji:"💰", t:"Conozco mi dinero", play:"lesson"},
  {id:2, emoji:"🧾", t:"¿Dónde se va mi dinero?", play:"survive"},
  {id:3, emoji:"📊", t:"Aprendo a hacer presupuesto", play:"budget"},
  {id:4, emoji:"🐷", t:"Aprendo a ahorrar", play:"saving"},
  {id:5, emoji:"🛟", t:"Mi fondo de emergencia", play:"fondo"},
  {id:6, emoji:"🏦", t:"Entiendo los bancos", play:"bancos"},
  {id:7, emoji:"📱", t:"Mi dinero en el celular", play:"celular"},
  {id:8, emoji:"💳", t:"Aprendo a usar tarjetas", play:"tarjetas"},
  {id:9, emoji:"💵", t:"¿Me conviene un préstamo?", play:"credit"},
  {id:10,emoji:"⚠️", t:"Evito el sobreendeudamiento", play:"deuda"},
  {id:11,emoji:"🛡️", t:"Protejo mi dinero", play:"seguridad"},
  {id:12,emoji:"🚨", t:"Detecto estafas", play:"scam"},
  {id:13,emoji:"📈", t:"Mi primera inversión", play:"inversion"},
  {id:14,emoji:"🎯", t:"Cumplo mis metas", play:"metas"},
];

const BADGES = [
  {id:"primer_paso", ico:"🌱", n:"Primer paso"},
  {id:"gastos_hormiga", ico:"🐜", n:"Cazador de hormigas"},
  {id:"presupuesto", ico:"📊", n:"Presupuesto equilibrado"},
  {id:"ahorrador", ico:"🐷", n:"Primer ahorro"},
  {id:"fondo", ico:"🛟", n:"Fondo blindado"},
  {id:"banquero", ico:"🏦", n:"Conoce sus bancos"},
  {id:"digital", ico:"📱", n:"Dinero digital seguro"},
  {id:"tarjeta", ico:"💳", n:"Tarjeta bajo control"},
  {id:"credito", ico:"🧠", n:"Experto en crédito"},
  {id:"equilibrio", ico:"⚖️", n:"Deuda saludable"},
  {id:"guardian", ico:"🛡️", n:"Guardián de claves"},
  {id:"anti_estafa", ico:"🚨", n:"Detector de estafas"},
  {id:"inversor", ico:"📈", n:"Inversor principiante"},
  {id:"metas", ico:"🎯", n:"Cumple sus metas"},
  {id:"maestro", ico:"🏆", n:"Maestro de finanzas"},
];

function t(k){ const L=S.lang||"es"; return (T[L]&&T[L][k]!=null)?T[L][k]:(T.es[k]!=null?T.es[k]:k); }
function levelTitle(id){ return t("lvl"+id); }
function applyNavLabels(){
  const map={map:"nav_learn",sims:"nav_sims",finan:"nav_finan",profile:"nav_profile"};
  document.querySelectorAll(".navbtn").forEach(b=>{
    const k=map[b.dataset.nav]; if(!k) return;
    const ico=b.querySelector(".ico").outerHTML;
    b.innerHTML=ico+t(k);
  });
}
function setLang(code){ S.lang=code; saveState(); applyNavLabels(); }

/* ================= UTILIDADES ================= */
const $ = s => document.querySelector(s);
const screensEl = $("#screens");
const soles = n => "S/ " + Number(n).toLocaleString("es-PE");

function updateTop(){
  $("#t-xp").textContent=S.xp; $("#t-sol").textContent=S.sol;
  $("#t-vidas").textContent=S.vidas; $("#t-racha").textContent=S.racha;
}
function toast(msg){
  const t=$("#toast"); t.textContent=msg; t.classList.add("show");
  clearTimeout(t._tm); t._tm=setTimeout(()=>t.classList.remove("show"),1900);
}
function award(xp,sol){
  S.xp+=xp; S.sol+=sol; updateTop(); saveState();
}
function unlockBadge(id){
  if(S.badges.has(id)) return;
  S.badges.add(id); saveState();
  const b=BADGES.find(x=>x.id===id);
  if(b) setTimeout(()=>toast("🏅 Insignia: "+b.n),400);
}
function showChrome(v){
  $("#topbar").classList.toggle("hidden",!v);
  $("#navbar").classList.toggle("hidden",!v);
  if(v) applyNavLabels();
}
function setNav(name){
  document.querySelectorAll(".navbtn").forEach(b=>b.classList.toggle("on",b.dataset.nav===name));
}

/* Router de pantallas */
function render(html){ screensEl.innerHTML = '<div class="screen active">'+html+'</div>'; screensEl.scrollTop=0; }
function go(name){ S.screen=name; ROUTES[name](); }

/* Overlay de recompensa */
function reward({emoji,title,sub,xp,sol,badge,then}){
  if(badge) unlockBadge(badge);
  const r=$("#reward");
  r.innerHTML=`
    <div class="r-emoji">${emoji}</div>
    <h2 style="margin-top:8px">${title}</h2>
    <p class="muted" style="margin-top:6px;font-weight:700">${sub||""}</p>
    <div class="r-rewards">
      ${xp?`<div class="r-chip"><div class="v" style="color:var(--violeta)">+${xp}</div><small>⭐ XP</small></div>`:""}
      ${sol?`<div class="r-chip"><div class="v" style="color:var(--sol-dark)">+${sol}</div><small>🪙 soles</small></div>`:""}
    </div>
    <button class="btn" id="reward-ok">${t("reward_continue")}</button>`;
  $("#overlay").classList.add("show");
  if(xp||sol) award(xp||0,sol||0);
  $("#reward-ok").onclick=()=>{ $("#overlay").classList.remove("show"); if(then) then(); };
}

const DIAG=[
  {q:"Si tienes S/ 1,000 y gastas S/ 1,200… ¿qué está pasando?",
   opts:["Estoy ahorrando","Estoy gastando más de lo que gano","Estoy invirtiendo"], ok:1,
   dim:"conocimiento"},
  {q:"Pagar solo el mínimo de tu tarjeta cada mes significa…",
   opts:["Que no pago intereses","Que la deuda baja rápido","Que pago más intereses y la deuda dura más"], ok:2,
   dim:"deuda"},
  {q:"Te llega un enlace: «Tu cuenta será bloqueada, ingresa aquí». ¿Qué haces?",
   opts:["Ingreso rápido para no perder mi cuenta","Ignoro y verifico por el canal oficial del banco","Comparto mi clave para confirmar"], ok:1,
   dim:"seguridad"},
  {q:"¿Cuál es la diferencia entre ahorrar e invertir?",
   opts:["Son exactamente lo mismo","Ahorrar guarda dinero; invertir busca que crezca asumiendo riesgo","Invertir es guardar dinero sin riesgo"], ok:1,
   dim:"conocimiento"},
];
ROUTES.diagnostic = () => {
  showChrome(false);
  let i=0, aciertos=0;
  const paint=()=>{
    const d=DIAG[i];
    render(`
      <div class="lesson-head">
        <div class="prog sol"><i style="width:${(i/DIAG.length)*100}%"></i></div>
        <span class="small muted" style="font-weight:900">${i+1}/${DIAG.length}</span>
      </div>
      <span class="tag sol">${t("diag_tag")}</span>
      <div class="spacer-s"></div>
      <h2>${d.q}</h2>
      <p class="small muted" style="font-weight:700;margin-top:4px">${t("diag_note")}</p>
      <div class="spacer-m"></div>
      <div id="opts"></div>`);
    const box=$("#opts");
    d.opts.forEach((o,k)=>{
      const b=document.createElement("button");
      b.className="opt"; b.innerHTML=`<span class="lead">${"ABC"[k]}</span><span>${o}</span>`;
      b.onclick=()=>{
        [...box.children].forEach(c=>c.disabled=true);
        if(k===d.ok){ b.classList.add("correct"); aciertos++; S.salud[d.dim]+=25; }
        else{ b.classList.add("wrong"); box.children[d.ok].classList.add("correct"); }
        setTimeout(()=>{ i++; i<DIAG.length?paint():finish(); },900);
      };
      box.appendChild(b);
    });
  };
  const finish=()=>{
    // nivel según aciertos
    S.nivelPerfil = aciertos>=3?"Aprendiz":"Explorador";
    // inicializa progreso: nivel 1 disponible
    LEVELS.forEach(l=> S.levels[l.id]= l.id===1?"current":"locked");
    S.salud.conocimiento=Math.min(100,20+aciertos*15);
    S.onboarded=true; S.lastDay=todayISO(); saveState();
    updateTop();
    render(`
      <div style="height:100%;display:flex;flex-direction:column;justify-content:center;text-align:center">
        <div style="font-size:72px" >🧭</div>
        <div class="spacer-s"></div>
        <span class="tag verde">${t("diag_start_tag")}</span>
        <div class="spacer-s"></div>
        <h1>${t("diag_level")}: <span style="color:var(--verde-dark)">${S.nivelPerfil}</span></h1>
        <div class="spacer-s"></div>
        <p class="muted" style="font-weight:700">${t("diag_hits")} ${aciertos} ${t("diag_of")} ${DIAG.length}. ${t("diag_route")}</p>
        <div class="spacer-l"></div>
        <div class="card" style="text-align:left">
          <h3>${t("diag_route_starts")}</h3>
          <div class="spacer-s"></div>
          <div style="display:flex;align-items:center;gap:12px">
            <div style="font-size:38px">💰</div>
            <div><b style="font-size:15px">${t("prof_lvl")} 1 · ${levelTitle(1)}</b></div>
          </div>
        </div>
        <div class="spacer-m"></div>
        <button class="btn" id="toMap">${t("diag_seemap")}</button>
      </div>`);
    $("#toMap").onclick=()=>{ unlockBadge("primer_paso"); go("map"); };
  };
  paint();
};

    if(idx>0) html+=`<div class="connector ${S.levels[LEVELS[idx-1].id]==='done'?'done':''}"></div>`;
    html+=`<div class="node ${st} ${zig}" data-lvl="${l.id}">
        <div class="dot">${st==='locked'?'🔒':l.emoji}</div>
        <div><div class="lvl-num">${t("prof_lvl")} ${l.id}</div><div class="lbl">${levelTitle(l.id)}</div></div>
      </div>`;
  });
  html+=`</div>`;
  // Nodo final: Maestro de finanzas
  const allDone = LEVELS.every(l=>S.levels[l.id]==="done");
  html+=`<div class="connector ${allDone?'done':''}"></div>
    <div class="node ${allDone?'current':'locked'}" id="maestro-node" style="justify-content:center">
      <div class="dot" style="width:78px;height:78px;font-size:38px">${allDone?'🏆':'🔒'}</div></div>
    <p class="center" style="font-weight:900;margin-top:4px;color:${allDone?'var(--sol-dark)':'var(--gris-soft)'}">${t("maestro_lbl")}</p>
    <div class="spacer-m"></div>`;
  render(html);
  const mNode=document.getElementById("maestro-node");
  if(mNode) mNode.querySelector(".dot").onclick=()=> allDone?go("maestro"):toast(t("maestro_locked"));
  document.querySelectorAll(".node").forEach(n=>{
    const id=+n.dataset.lvl, st=S.levels[id];
    if(st==="locked"){ n.querySelector(".dot").onclick=()=>toast(t("map_locked")); return; }
    n.querySelector(".dot").onclick=()=>openLevel(id);
  });
};

function openLevel(id){
  const l=LEVELS.find(x=>x.id===id);
  if(l.play==="soon"){ toast(t("map_soon")); return; }
  PLAY[l.play](id);
}

/* Completar un nivel: marca done y desbloquea siguiente */
function completeLevel(id){
  S.levels[id]="done";
  const next=LEVELS.find(x=>x.id===id+1);
  if(next && S.levels[next.id]==="locked") S.levels[next.id]="current";
  // ¿completó los 14? -> Maestro de finanzas
  const done=LEVELS.filter(l=>S.levels[l.id]==="done").length;
  if(done===LEVELS.length && !S.badges.has("maestro")){
    S.nivelPerfil="Maestro"; unlockBadge("maestro");
  }
  saveState();
}

  }
  ids.forEach(i=>$("#"+i).oninput=draw); draw();
  if(fromLevel) $("#fin").onclick=()=>{

PLAY.scam=(id)=>{

  const cases=[

     estafa:false, why:"Es una notificación normal dentro de tu app oficial. No pide datos ni contraseñas."},
    {txt:"☎️ Llamada: «Soy de su banco. Para un premio, deme su clave de 6 dígitos y el código que le llegó por SMS.»",
     estafa:true, why:"Ningún banco pide tu clave ni el código SMS por teléfono. Nunca los compartas."},

     estafa:true, why:"Suplantación de identidad. Verifica llamando al número que ya conocías antes de enviar dinero."},

  ];
  let i=0, aciertos=0;
  const paint=()=>{
    const c=cases[i];
    render(`<div class="lesson-head"><button class="x" onclick="go('map')">✕</button>
        <div class="prog"><i style="width:${(i/cases.length)*100}%"></i></div>

      </div>`);

      const ok = guess===c.estafa;

      else{ S.vidas=Math.max(0,S.vidas-1); updateTop(); }
      showFeedback(ok, `<b>${c.estafa?'Era una ESTAFA.':'Era REAL.'}</b> ${c.why}`, ()=>{
        i++; i<cases.length?paint():finish();

/* Cabecera reutilizable de lección */
function lessonHead(pct){
  return `<div class="lesson-head">
    <button class="x" onclick="if(confirm('¿Salir del nivel? Perderás el avance de esta sesión.'))go('map')">✕</button>
    <div class="prog"><i style="width:${pct}%"></i></div></div>`;
}

/* Motor genérico de quiz con escenas + feedback (para bancos, celular, seguridad) */
function runQuiz(id, cfg){
  showChrome(false);
  let i=0, aciertos=0;
  const paint=()=>{
    const c=cfg.cases[i];
    render(lessonHead((i/cfg.cases.length)*100)+
      `<span class="tag" style="background:${cfg.tagBg};color:${cfg.tagColor}">${cfg.tag}</span>
      <span class="small muted" style="font-weight:900;float:right">${i+1}/${cfg.cases.length}</span>
      <div class="spacer-s"></div>
      ${c.scene?`<div class="card" style="background:var(--nube-2);font-weight:700;font-size:14.5px;line-height:1.5">${c.scene}</div><div class="spacer-s"></div>`:""}
      <h2>${c.q}</h2>
      <div class="spacer-m"></div><div id="opts"></div>`);
    const box=$("#opts");
    c.opts.forEach((o,k)=>{
      const b=document.createElement("button");
      b.className="opt"; b.innerHTML=`<span class="lead">${"ABCD"[k]}</span><span>${o[0]}</span>`;
      b.onclick=()=>{
        [...box.children].forEach(x=>x.disabled=true);
        if(o[1]){ b.classList.add("correct"); aciertos++; }
        else{
          b.classList.add("wrong");
          const ci=c.opts.findIndex(z=>z[1]); if(ci>=0) box.children[ci].classList.add("correct");
          S.vidas=Math.max(0,S.vidas-1); updateTop();
        }
        showFeedback(o[1], o[2], ()=>{ i++; i<cfg.cases.length?paint():finish(); });
      };
      box.appendChild(b);
    });
  };
  const finish=()=>{
    if(cfg.health) cfg.health(aciertos, cfg.cases.length);
    completeLevel(id);
    const gotBadge = cfg.badgeIf ? cfg.badgeIf(aciertos,cfg.cases.length) : true;
    reward({emoji:cfg.emoji, title:cfg.finishTitle,
      sub:cfg.finishSub(aciertos,cfg.cases.length),
      xp:cfg.xp||30, sol:cfg.sol||15, badge:gotBadge?cfg.badge:null, then:()=>go("map")});
  };
  paint();
}

          <circle cx="75" cy="75" r="${R}" fill="none" stroke="#E2E8F0" stroke-width="14"/>
          <circle cx="75" cy="75" r="${R}" fill="none" stroke="${score>=70?'#10B981':score>=40?'#F59E0B':'#EF4444'}"
            stroke-width="14" stroke-linecap="round"
            stroke-dasharray="${C}" stroke-dashoffset="${off}" style="transition:stroke-dashoffset 1s"/>
        </svg>
        <div class="g-num"><div><b>${score}</b><div class="small muted" style="font-weight:800">${t("prof_of100")}</div></div></div>
      </div>
      <p style="font-weight:700;margin-top:6px">${score>=70?t("health_good"):score>=40?t("health_mid"):t("health_low")}</p>
    </div>
    <div class="spacer-m"></div>
    <div class="card">
      ${dims.map((d,k)=>`<div class="dim-row">
        <span class="d-name">${d[1]}</span>
        <div class="prog ${vals[k]>=70?'':vals[k]>=40?'sol':''}"><i style="width:${vals[k]}%;background:${vals[k]>=70?'var(--verde)':vals[k]>=40?'var(--sol)':'var(--coral)'}"></i></div>
        <span class="d-val">${vals[k]}%</span></div>`).join("")}
      <div style="background:var(--sol-soft);border-radius:12px;padding:12px;margin-top:6px">
        <b style="color:var(--sol-dark)">${t("prof_opportunity")}</b>
        <p style="font-weight:700;margin-top:4px;font-size:13.5px">${weakestAdvice(dims,vals)}</p>
      </div>
    </div>
    <div class="spacer-m"></div>
    <h3>${t("prof_mybadges")}</h3>
    <div class="spacer-s"></div>
    <div class="badge-grid">
      ${BADGES.map(b=>`<div class="badge ${S.badges.has(b.id)?'got':''}">
        <div class="b-ico">${b.ico}</div><div class="b-name">${b.n}</div></div>`).join("")}
    </div>
    <div class="spacer-m"></div>
    <h3>${t("prof_lang")}</h3>
    <div class="spacer-s"></div>
    <div id="langpick" style="display:flex;gap:8px;flex-wrap:wrap"></div>
    <div class="spacer-m"></div>
    <button class="btn ghost" id="reset-btn">${t("prof_reset")}</button>
    <div class="spacer-m"></div>`);
  // selector de idioma
  const lp=$("#langpick");
  LANGS.forEach(l=>{
    const b=document.createElement("button");
    const on=(S.lang===l.code);
    b.className="chip"+(on?" sel":""); b.style.fontSize="13px"; b.style.padding="10px 13px";
    b.innerHTML=`${l.flag} ${l.native}`;
    b.onclick=()=>{ setLang(l.code); go("profile"); };
    lp.appendChild(b);
  });
  $("#reset-btn").onclick=()=>{ if(confirm(t("prof_reset")+" ?")) resetApp(); };
};
function weakestAdvice(dims,vals){
  let min=101,idx=0; vals.forEach((v,k)=>{if(v<min){min=v;idx=k;}});
  const tips={presupuesto:"Crea tu presupuesto en el Nivel 3 para saber a dónde va tu dinero.",
    ahorro:"Empieza a ahorrar aunque sea poco: prueba el simulador de metas.",
    fondo:"Arma tu fondo de emergencia: junta de a pocos, 3 a 6 meses de gastos.",
    deuda:"Aprende a comparar créditos (Nivel 9) y cuida no pasar del 30% de tus ingresos en deudas.",
    seguridad:"Practica el detector de estafas (Nivel 12) para proteger tu dinero.",
    conocimiento:"Sigue completando niveles: cada uno suma a tu conocimiento.",
    metas:"Define una meta concreta en el simulador de ahorro y ponle fecha."};
  return "Tu punto más bajo es <b>"+dims[idx][1]+"</b>. "+tips[dims[idx][0]];
}

/* ================= NAV + INIT ================= */
function todayISO(){ return new Date().toISOString().slice(0,10); }
function updateStreak(){
  const t=todayISO();
  if(!S.lastDay){ S.lastDay=t; return; }
  if(S.lastDay===t) return;                  // mismo día, sin cambios
  const diff=(new Date(t)-new Date(S.lastDay))/86400000;
  if(diff===1){ S.racha=(S.racha||0)+1; }    // día consecutivo
  else if(diff>1){ S.racha=1; }              // se rompió la racha
  S.lastDay=t; saveState();
}

/* Pantalla de graduación: Maestro de mis finanzas */
ROUTES.maestro=()=>{
  showChrome(true); setNav("map");
  render(`<div class="center" style="padding-top:20px">
      <div style="font-size:84px;animation:bob 2s ease-in-out infinite">🏆</div>
      <div class="spacer-s"></div>
      <span class="tag sol">🎉</span>
      <h1 style="margin-top:10px">${t("maestro_lbl")}</h1>
      <div class="spacer-s"></div>
      <p class="muted" style="font-weight:700">${S.name} 🎉</p>
      <div class="spacer-m"></div>
      <div class="kpi">
        <div class="k"><b>${S.xp}</b><span>${t("prof_xp")}</span></div>
        <div class="k"><b>${S.badges.size}</b><span>${t("prof_badges")}</span></div>
      </div>
      <div class="spacer-m"></div>
      <div class="spacer-m"></div>
      <button class="btn" id="toMap">${t("b_back_map")}</button>
    </div>`);
  $("#toMap").onclick=()=>go("map");
};

function resetApp(){
  clearState();
  S.name="";S.nivelPerfil="Explorador";S.lang=null;S.xp=0;S.sol=0;S.racha=1;S.vidas=5;
  S.levels={};S.badges=new Set();S.onboarded=false;S.lastDay=null;
  Object.keys(S.salud).forEach(k=>S.salud[k]=0);
  updateTop(); go("chooseLang");
}
document.querySelectorAll(".navbtn").forEach(b=>{
  b.onclick=()=>go(b.dataset.nav);
});

/* Arranque: idioma → bienvenida → (o mapa si ya hay progreso) */
function initApp(){
  const resumed = loadState();
  updateTop();
  if(!S.lang){ go("chooseLang"); return; }   // primera vez: elegir idioma
  if(resumed){
    updateStreak(); updateTop();
    const done=LEVELS.filter(l=>S.levels[l.id]==="done").length;
    if(done===LEVELS.length){ go("maestro"); } else { go("map"); }
  } else {
    go("welcome");
  }
}
initApp();
</script>
